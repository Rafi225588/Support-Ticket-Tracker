spring.application.name=support-ticket-tracker

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/support_ticket_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jackson.mapper.sort-properties-alphabetically=false

spring.data.web.pageable.max-page-size=100
