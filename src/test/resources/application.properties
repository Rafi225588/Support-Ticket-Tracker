spring.datasource.url=jdbc:h2:mem:ticketdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.jackson.mapper.sort-properties-alphabetically=false

spring.data.web.pageable.max-page-size=100

app.jwt.secret=test-secret-at-least-32-characters-long-for-tests
app.jwt.access-expiration-minutes=15
app.jwt.refresh-expiration-days=7
app.cookie.secure=false